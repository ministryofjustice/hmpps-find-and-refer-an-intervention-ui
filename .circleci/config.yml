version: 2.1
orbs:
  hmpps: ministryofjustice/hmpps@10
  slack: circleci/slack@4.12.5
  node: circleci/node@4.5.2
parameters:
  releases-slack-channel:
    type: string
    default: find-refer-interventions-dev-notification
  node-version:
    type: string
    default: 24.0-browsers
jobs:
  build:
    executor:
      name: hmpps/node
      tag: << pipeline.parameters.node-version >>
    steps:
      - checkout
      - run:
          name: Update npm
          command: 'sudo npm install -g npm@^11'
      - restore_cache:
          key: dependency-cache-{{ checksum "package-lock.json" }}
      - run:
          name: Install Dependencies
          command: npm ci --no-audit
      - save_cache:
          key: dependency-cache-{{ checksum "package-lock.json" }}
          paths:
            - node_modules
            - ~/.cache
      - run:
          command: |
            npm run build
      - run: # Run linter after build because the integration test code depend on compiled typescript...
          name: Linter check
          command: npm run lint
      - persist_to_workspace:
          root: .
          paths:
            - node_modules
            - build
            - dist
            - assets
  unit_test:
    executor:
      name: hmpps/node
      tag: << pipeline.parameters.node-version >>
    steps:
      - checkout
      - restore_cache:
          key: dependency-cache-{{ checksum "package-lock.json" }}
      - run:
          name: unit tests
          command: npm run test:ci
      - store_test_results:
          path: test_results/unit/xml
      - store_artifacts:
          path: test_results/unit
      - store_artifacts:
          path: test_results/unit/xml
          # end_to_end_test:
          #   docker:
          #     - image: mcr.microsoft.com/playwright:v1.52.0-noble
          #   circleci_ip_ranges: true # opt-in to jobs running on a restricted set of IPs
          #   steps:
          #     - run:
          #         name: Clone E2E repo
          #         command: |
          #           git clone https://github.com/ministryofjustice/hmpps-find-and-refer-an-intervention-e2e .
          #     - run:
          #         name: Update npm
          #         command: 'npm install -g npm@^11'
          #     - node/install-packages
